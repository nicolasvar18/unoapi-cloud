x-base: &base
  build:
    dockerfile: develop.Dockerfile
  entrypoint: echo 'ok!'
  tty: true
  stdin_open: true
  volumes:
    - ./:/app
    - /app/node_modules
  working_dir: /app
  env_file:
    - .env
  environment:
    NODE_ENV: development
    AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672?frameMax=8192
    BASE_URL: http://web:9876
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    STORAGE_ENDPOINT: http://minio:9000
    STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
    STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
    UNOAPI_URL: http://web:9876
    WEBHOOK_URL: http://web:9876/webhooks/fake
    DEFAULT_LOCALE: es
    GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
    DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-admin}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASS: ${SMTP_PASS:-}
    SMTP_FROM: ${SMTP_FROM:-}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    ALERT_EMAILS: ${ALERT_EMAILS:-}

x-minio: &minio
  image: elestio/minio:latest
  command: server --console-address ":9001" --address ":9000" /data
  env_file: .env
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
    interval: 30s
    timeout: 20s
    retries: 3

services:
  web:
    <<: *base
    restart: on-failure
    entrypoint: sh -c 'wait-for redis:6379 rabbitmq:5672 -- yarn web-dev'
    ports:
      - 9876:9876
    depends_on:
      - worker

  worker:
    <<: *base
    restart: on-failure
    entrypoint: sh -c 'wait-for redis:6379 rabbitmq:5672 -- yarn worker-dev'
    depends_on:
      - redis
      - rabbitmq

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: on-failure
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    restart: on-failure
    volumes:
      - redis:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - 127.0.0.1:6379:6379

  insight:
    image: redis/redisinsight
    restart: on-failure
    volumes:
      - insight:/data
    ports:
      - 5540:5540
    environment:
      RI_LOG_LEVEL: debug
      RIAUTHPROMPT: 5
      RIAUTHTIMER: 1
    depends_on:
      - redis

  minio:
    <<: *minio
    restart: on-failure
    ports:
      - 9001:9001
      - 9000:9000
    volumes:
      - minio:/data
    entrypoint: |
      /bin/sh -c "
      echo 'Starting Minio and setting up project bucket...' &&
      /usr/bin/minio server --console-address ':9001' --address ':9000' /data &
      ## Wait for minio to be ready
      until (echo > /dev/tcp/localhost/9000) >/dev/null 2>&1; do
        echo 'Waiting for minio to be ready...'
        sleep 5
      done &&
      ## Configure bucket
      /usr/bin/mc alias set local http://localhost:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD &&
      if ! /usr/bin/mc ls local/$STORAGE_BUCKET_NAME > /dev/null 2>&1; then
        /usr/bin/mc mb local/$STORAGE_BUCKET_NAME &&
        echo 'Bucket created successfully'
      else
        echo 'Bucket already exists, skipping creation'
      fi &&
      ## Keep container running
      wait
      "

volumes:
  rabbitmq:
  redis:
  minio:
  insight:
